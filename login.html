<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobrança - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=13">
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 20px;">
                <a href="index.html" class="logo-wrapper" title="Voltar para a página inicial" style="justify-content: center;">
                    <img src="img/logo.svg" alt="Cobrança Task Bvgarantia" style="max-height: 80px; margin: 0 auto;">
                </a>
            </div>
            <p class="login-subtitle">Faça login para acessar o sistema</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Seu e-mail cadastrado">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Sua senha">
                </div>
                <button type="submit" id="btnEntrar" class="btn-primary btn-block">Entrar</button>
            </form>
            <div id="loginMessage" class="message-box"></div>
        </div>
    </div>

    <div class="theme-toggle-container login-theme-toggle">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Alternar Tema Claro/Escuro">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
